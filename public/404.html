<!doctype html>
<html lang="ar" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>404 — الصفحة غير موجودة | Pulse OCTO</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        background: radial-gradient(circle at 50% 20%, #1a0b2e 0%, #06050a 55%, #030306 100%);
        color: #f4f1fb;
        font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
        text-align: center;
      }
      main {
        max-width: 560px;
        width: 100%;
        padding: 2.5rem 2rem;
        border-radius: 24px;
        background: rgba(14, 11, 24, 0.86);
        border: 1px solid rgba(168, 85, 247, 0.28);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.75);
      }
      .code {
        font-size: 4rem;
        font-weight: 900;
        letter-spacing: 0.06em;
        color: #c084fc;
        line-height: 1;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 800;
        margin-bottom: 0.75rem;
        color: #ffffff;
      }
      p {
        color: #a1a1aa;
        font-size: 0.95rem;
        line-height: 1.7;
        margin-bottom: 1.75rem;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
      }
      a {
        display: inline-block;
        padding: 0.7rem 1.35rem;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
        font-size: 0.9rem;
        transition: opacity 0.2s ease, border-color 0.2s ease;
      }
      a.primary {
        background: linear-gradient(135deg, #7c3aed, #5b21b6);
        color: #ffffff;
        border: 1px solid rgba(216, 180, 254, 0.45);
      }
      a.secondary {
        background: rgba(255, 255, 255, 0.05);
        color: #e4e4e7;
        border: 1px solid rgba(255, 255, 255, 0.14);
      }
      a:hover { opacity: 0.9; }
    </style>
  </head>
  <body>
    <main>
      <div class="code" aria-hidden="true">404</div>
      <h1>الصفحة المطلوبة غير موجودة — Pulse OCTO</h1>
      <p>
        الرابط الذي تحاول الوصول إليه غير متاح أو تم نقله. يمكنك العودة إلى الصفحة الرئيسية أو استكشاف خدمات ومنظومة Pulse OCTO.
      </p>
      <nav aria-label="روابط العودة">
        <a class="primary" href="/">العودة للرئيسية</a>
        <a class="secondary" href="/about">من نحن</a>
        <a class="secondary" href="/services">الخدمات</a>
        <a class="secondary" href="/contact">تواصل معنا</a>
      </nav>
    </main>
  </body>
</html>
